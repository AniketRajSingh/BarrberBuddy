<!DOCTYPE html>
<html>
  <head>
    <title>Face Shape Detection</title>
  </head>
  <body>
    <h1>Face Shape Detection</h1>
    <video id="video" width="640" height="480" autoplay muted playsinline></video>
    <h2>All Face Points</h2>
    <canvas id="canvas" width="640" height="480"></canvas>
    <canvas id="all_points_canvas" width="640" height="480"></canvas>
    <h2 id="face-shape"></h2>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>

    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

    <!-- Face Landmarks Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@0.0.3/dist/face-landmarks-detection.js"></script>

    <script src="faceshape.js"></script>
  </body>
</html>
